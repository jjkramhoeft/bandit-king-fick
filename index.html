<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandit King of Ancient China</title>
<meta name="description" content="A browser recreation of a 1989 Amiga strategy game about the outlaw heroes of Water Margin.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="screen" aria-live="polite">
    <div id="menubar" role="menubar"></div>

    <div id="game" hidden>
      <section id="info" class="panel"></section>
      <section id="mapwrap" class="panel">
        <canvas id="map" width="348" height="266" aria-label="Map of Song China"></canvas>
        <div id="maptip" hidden></div>
      </section>
      <section id="anim" class="panel"><canvas id="vignette" width="136" height="52" aria-hidden="true"></canvas></section>
      <section id="msg" class="panel">
        <div id="msgtext"></div>
        <div id="prompt"></div>
      </section>
    </div>

    <div id="battle" hidden></div>
    <div id="title" hidden></div>
    <div id="overlay" hidden></div>
  </div>
</div>
<noscript><p class="noscript">This game needs JavaScript.</p></noscript>

<script src="js/core/ns.js"></script>
<script src="js/core/mapgeo.js"></script>
<script src="js/data/map.js"></script>
<script src="js/data/heroes.js"></script>
<script src="js/data/scenarios.js"></script>
<script src="js/engine/world.js"></script>
<script src="js/engine/econ.js"></script>
<script src="js/engine/actions.js"></script>
<script src="js/engine/battle.js"></script>
<script src="js/engine/war.js"></script>
<script src="js/engine/ai.js"></script>
<script src="js/engine/setup.js"></script>
<script src="js/engine/game.js"></script>
<script src="js/engine/flows.js"></script>
<script src="js/engine/save.js"></script>
<script src="js/art/portrait.js"></script>
<script src="js/art/vignette.js"></script>
<script src="js/art/titleart.js"></script>
<script src="js/audio/music.js"></script>
<script src="js/ui/art.js"></script>
<script src="js/ui/mapview.js"></script>
<script src="js/ui/screen.js"></script>
<script src="js/ui/battleview.js"></script>
<script src="js/ui/title.js"></script>
<script src="js/main.js"></script>
</body>
</html>
